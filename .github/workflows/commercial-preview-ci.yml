name: AVAN operational source and Docker installation checks

on:
  push:
    paths:
      - "commercial/**"
      - "compose.https.yaml"
      - "infra/**"
      - ".dockerignore"
      - "scripts/init-security.sh"
      - "scripts/configure-turnstile.ps1"
      - "scripts/pin-license-public-key.ps1"
      - "commercial/production_*.py"
      - "commercial/setup_*.py"
      - "commercial/meeting_questions.py"
      - "commercial/agent*.py"
      - "commercial/meeting_agent.py"
      - "commercial/secretary_agent.py"
      - "commercial/tests/**"
      - "commercial/processmaker_store.py"
      - "commercial/native_access.py"
      - "commercial/sql/AVANAgent_*"
      - "processmaker/**"
      - "scripts/update-meeting-agent.ps1"
      - "commercial/security.py"
      - "commercial/licensing/**"
      - "commercial/web/production/**"
      - "commercial/web/admin/**"
      - "commercial/sql/PRODUCTION_EnterpriseProcess2_*"
      - "commercial/Dockerfile.production"
      - "commercial/requirements-production.txt"
      - "commercial/tests/test_operational_bootstrap.py"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".github/workflows/commercial-preview-ci.yml"
  pull_request:
    paths:
      - "commercial/**"
      - "compose.https.yaml"
      - "infra/**"
      - ".dockerignore"
      - "scripts/init-security.sh"
      - "scripts/configure-turnstile.ps1"
      - "scripts/pin-license-public-key.ps1"
      - "commercial/production_*.py"
      - "commercial/setup_*.py"
      - "commercial/meeting_questions.py"
      - "commercial/agent*.py"
      - "commercial/meeting_agent.py"
      - "commercial/secretary_agent.py"
      - "commercial/tests/**"
      - "commercial/processmaker_store.py"
      - "commercial/native_access.py"
      - "commercial/sql/AVANAgent_*"
      - "processmaker/**"
      - "scripts/update-meeting-agent.ps1"
      - "commercial/security.py"
      - "commercial/licensing/**"
      - "commercial/web/production/**"
      - "commercial/web/admin/**"
      - "commercial/sql/PRODUCTION_EnterpriseProcess2_*"
      - "commercial/Dockerfile.production"
      - "commercial/requirements-production.txt"
      - "commercial/tests/test_operational_bootstrap.py"
      - "compose.yaml"
      - "compose.production.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install operational dependencies
        run: python -m pip install -r commercial/requirements-production.txt pytest
      - name: Check source and authenticated installation lifecycle
        run: |
          python -m py_compile commercial/production_store.py commercial/production_license.py commercial/production_app.py commercial/production_install.py commercial/production_onboarding.py commercial/pending_identities.py commercial/processmaker_directory.py commercial/setup_console.py commercial/setup_routes.py commercial/turnstile.py commercial/meeting_questions.py commercial/security.py commercial/licensing/codec.py commercial/agent_connections.py commercial/bundled_sql.py infra/antibot/server.py
          python -m pytest commercial/tests -q
          python -c "from commercial.production_app import app; assert app.title == 'AVAN'"
      - name: Validate customer-facing JavaScript
        run: |
          node --check commercial/web/production/app.js
          node --check commercial/web/admin/app.js
          node --check commercial/web/admin/login-scene.js
          node --check commercial/web/admin/help.js
          node --check infra/keycloak/themes/avan/login/resources/js/otp-motion.js
          node --check infra/keycloak/themes/avan/login/resources/js/captcha-ui.js
          node --check infra/keycloak/themes/avan/login/resources/js/login-reveal.js
          node --check infra/keycloak/themes/avan/login/resources/js/login-scene.js
      - name: Validate approved live login scene assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          roots=[
              Path("commercial/web/admin/scene-data"),
              Path("infra/keycloak/themes/avan/login/resources/scene-data"),
          ]
          decoded=[]
          for root in roots:
              background="".join((root/f"bg-{i}.b64").read_text().strip() for i in range(5))
              globe="".join((root/f"globe-{i}.b64").read_text().strip() for i in range(2))
              b=base64.b64decode(background,validate=True)
              g=base64.b64decode(globe,validate=True)
              assert b[:4]==b"RIFF" and b[8:12]==b"WEBP" and len(b)>10000
              assert g[:4]==b"RIFF" and g[8:12]==b"WEBP" and len(g)>5000
              decoded.append((b,g))
          assert decoded[0]==decoded[1], "Bootstrap and Keycloak login scene assets differ"
          print("Approved AVAN Live Login V2 assets are valid and synchronized.")
          PY
      - name: Browser smoke test with isolated API fixtures
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node commercial/tests/ui_smoke.cjs
          node commercial/tests/management_render_smoke.cjs
          node commercial/tests/login_scene_smoke.cjs
      - name: Validate env-free first-run Compose
        run: |
          docker compose config --quiet
          AVAN_APP_HOST=agent.example.com AVAN_AUTH_HOST=auth.example.com docker compose -f compose.yaml -f compose.https.yaml config --quiet
          python - <<'PY'
          from pathlib import Path
          c=Path("compose.yaml").read_text()
          dockerfile=Path("commercial/Dockerfile.production").read_text()
          assert "avan-state:" in c
          assert "avan-agent-sql:" in c
          assert "antibot:" in c and "infra/antibot/Dockerfile" in c
          assert "avan_antibot_hmac_key" in c
          assert "avan_turnstile_site_key" in c and "avan_turnstile_secret_key" in c
          assert "mcr.microsoft.com/mssql/server:2022-latest" in c
          assert "1433:1433" not in c
          assert "127.0.0.1:8188:8188" in c
          assert "env_file:" not in c and "AVAN_SQL_PASSWORD" not in c
          assert "commercial.production_app:app" in dockerfile
          assert "commercial/datasets" not in dockerfile
          assert "setup_console.py" in dockerfile and "setup_routes.py" in dockerfile
          print("Operational GodAdmin installation requires no editable .env file.")
          PY


      - name: Build self-hosted anti-bot image
        run: docker build -f infra/antibot/Dockerfile -t avan-antibot:ci .

      - name: Build Keycloak hybrid anti-bot provider
        run: docker build -f infra/keycloak/Dockerfile -t avan-keycloak:ci .

      - name: Build production image and verify packaged imports
        run: |
          docker build -f commercial/Dockerfile.production -t avan-agent:ci .
          docker run --rm --entrypoint python avan-agent:ci -c "from commercial.production_app import app; assert app.title == 'AVAN'"
          docker run --rm --tmpfs /var/lib/avan:uid=10001,gid=10001 --entrypoint python avan-agent:ci -c "from commercial.setup_console import initialize; initialize(); from commercial.production_app import app; assert app.title == 'AVAN'; from commercial.setup_console import get_setting; assert not get_setting('agent_sql'); print('First-run setup ready without configured databases')"

      - name: Build offline license issuer and scenario importer
        run: |
          docker build -f commercial/Dockerfile.license -t avan-issuer:ci .
          docker run --rm avan-issuer:ci --help
          docker build -f commercial/Dockerfile.scenarios -t avan-scenarios:ci .
          docker run --rm avan-scenarios:ci --help

      - name: Validate HTTPS gateway configuration
        run: docker run --rm -e AVAN_APP_HOST=agent.example.com -e AVAN_AUTH_HOST=auth.example.com -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
