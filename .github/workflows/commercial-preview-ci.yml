name: AVAN operational source and container validation

on:
  push:
    paths:
      - "commercial/production_*.py"
      - "commercial/meeting_questions.py"
      - "commercial/security.py"
      - "commercial/licensing/codec.py"
      - "commercial/web/production/**"
      - "commercial/sql/PRODUCTION_EnterpriseProcess2_*"
      - "commercial/Dockerfile.production"
      - "commercial/requirements-production.txt"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".github/workflows/commercial-preview-ci.yml"
  pull_request:
    paths:
      - "commercial/production_*.py"
      - "commercial/meeting_questions.py"
      - "commercial/security.py"
      - "commercial/licensing/codec.py"
      - "commercial/web/production/**"
      - "commercial/sql/PRODUCTION_EnterpriseProcess2_*"
      - "commercial/Dockerfile.production"
      - "commercial/requirements-production.txt"
      - "compose.yaml"
      - "compose.production.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install production dependencies
        run: python -m pip install -r commercial/requirements-production.txt
      - name: Validate production Python imports and source syntax
        run: |
          python -m py_compile commercial/production_store.py commercial/production_license.py commercial/production_app.py commercial/meeting_questions.py commercial/security.py commercial/licensing/codec.py
          python -c "from commercial.production_app import app; assert app.title == 'AVAN'"
      - name: Validate customer-facing JavaScript
        run: node --check commercial/web/production/app.js
      - name: Verify production Compose points exclusively to EnterpriseProcess2
        run: |
          cp .env.production.example .env.production
          docker compose -f compose.production.yaml config --quiet
          python - <<'PY'
          from pathlib import Path
          compose=Path("compose.yaml").read_text()
          image=Path("commercial/Dockerfile.production").read_text()
          assert "EnterpriseProcess2" in compose
          assert "EnterpriseProcess2_AI_Test" not in compose
          assert "demo_preview" not in image
          assert "commercial.production_app:app" in image
          assert "commercial/datasets" not in image
          print("Operational image excludes fictional-data runtime")
          PY
