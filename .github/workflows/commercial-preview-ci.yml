name: AVAN operational source and Docker installation checks

on:
  push:
    paths:
      - "commercial/production_*.py"
      - "commercial/setup_*.py"
      - "commercial/meeting_questions.py"
      - "commercial/security.py"
      - "commercial/licensing/**"
      - "commercial/web/production/**"
      - "commercial/web/admin/**"
      - "commercial/sql/PRODUCTION_EnterpriseProcess2_*"
      - "commercial/Dockerfile.production"
      - "commercial/requirements-production.txt"
      - "commercial/tests/test_operational_bootstrap.py"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".github/workflows/commercial-preview-ci.yml"
  pull_request:
    paths:
      - "commercial/production_*.py"
      - "commercial/setup_*.py"
      - "commercial/meeting_questions.py"
      - "commercial/security.py"
      - "commercial/licensing/**"
      - "commercial/web/production/**"
      - "commercial/web/admin/**"
      - "commercial/sql/PRODUCTION_EnterpriseProcess2_*"
      - "commercial/Dockerfile.production"
      - "commercial/requirements-production.txt"
      - "commercial/tests/test_operational_bootstrap.py"
      - "compose.yaml"
      - "compose.production.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install operational dependencies
        run: python -m pip install -r commercial/requirements-production.txt
      - name: Check source and authenticated installation lifecycle
        run: |
          python -m py_compile commercial/production_store.py commercial/production_license.py commercial/production_app.py commercial/production_install.py commercial/setup_console.py commercial/setup_routes.py commercial/meeting_questions.py commercial/security.py commercial/licensing/codec.py
          python -m unittest commercial.tests.test_operational_bootstrap -v
          python -c "from commercial.production_app import app; assert app.title == 'AVAN'"
      - name: Validate customer-facing JavaScript
        run: |
          node --check commercial/web/production/app.js
          node --check commercial/web/admin/app.js
      - name: Validate env-free first-run Compose
        run: |
          docker compose config --quiet
          python - <<'PY'
          from pathlib import Path
          c=Path("compose.yaml").read_text()
          dockerfile=Path("commercial/Dockerfile.production").read_text()
          assert "avan-control-data:" in c
          assert "127.0.0.1:8188:8188" in c
          assert "env_file:" not in c and "AVAN_SQL_PASSWORD" not in c
          assert "commercial.production_app:app" in dockerfile
          assert "commercial/datasets" not in dockerfile
          assert "setup_console.py" in dockerfile and "setup_routes.py" in dockerfile
          print("Operational GodAdmin installation requires no editable .env file.")
          PY
