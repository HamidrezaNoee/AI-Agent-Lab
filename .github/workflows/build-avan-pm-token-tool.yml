name: Build AVAN ProcessMaker Token Tool for Windows

on:
  push:
    branches:
      - feature/avan-pm-token-tool-20260921
    paths:
      - "tools/avan-pm-token/source/**"
      - ".github/workflows/build-avan-pm-token-tool.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Build EXE from source
        working-directory: tools/avan-pm-token/source
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-s -w" -o ../Avan-ProcessMaker-Token-Tool.exe .
          if ($LASTEXITCODE -ne 0) { throw "Go build failed" }
      - name: Commit built EXE to feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/avan-pm-token/Avan-ProcessMaker-Token-Tool.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "EXE already present"; exit 0 }
          git commit -m "Build Windows ProcessMaker token tool executable"
          if ($LASTEXITCODE -ne 0) { throw "Git commit failed" }
          git push origin HEAD:feature/avan-pm-token-tool-20260921
          if ($LASTEXITCODE -ne 0) { throw "Git push failed" }
