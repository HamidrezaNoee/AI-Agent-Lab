# AVAN operational MTG (EnterpriseProcess2), no demo datasets or /v1 endpoints.
# Explicitly configured confidential IdP + verified PM mappings required.
name: avan-production
services:
  avan:
    image: avan-enterprise:local
    build:
      context: .
      dockerfile: commercial/Dockerfile.production
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8188"
    env_file:
      - path: ./.env.production
        required: true
    environment:
      AVAN_SQL_DATABASE: EnterpriseProcess2
      AVAN_SQL_USER: AVAN_Reader
      AVAN_LICENSE_PUBLIC_KEY_PATH: /run/avan/license-public.pem
    volumes:
      - type: bind
        source: ./private/license-public.pem
        target: /run/avan/license-public.pem
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 160
    mem_limit: 768m
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8188/health',timeout=3).status==200"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
