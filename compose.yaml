name: avan-production

services:
  ui-config-init:
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    command: ["sh","-ec","mkdir -p /ui && chown -R 10001:10001 /ui && chmod 0755 /ui"]
    volumes:
      - avan-ui:/ui

  agent-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    entrypoint: ["/bin/bash","-ec"]
    command:
      - |
        export MSSQL_SA_PASSWORD="$$(cat /run/secrets/avan_sql_sa_password)"
        exec /opt/mssql/bin/sqlservr
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "1400"
    secrets:
      - avan_sql_sa_password
    volumes:
      - avan-agent-sql:/var/opt/mssql
    mem_limit: 2304m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL","/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$(cat /run/secrets/avan_sql_sa_password)\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20

  agent-sql-init:
    image: avan-enterprise:local
    command: ["python","-m","commercial.bundled_sql"]
    restart: "no"
    environment:
      AVAN_STATE_DIR: /var/lib/avan
      AVAN_BUNDLED_SQL_SA_PASSWORD_PATH: /run/secrets/avan_sql_sa_password
    secrets:
      - avan_sql_sa_password
    volumes:
      - avan-state:/var/lib/avan
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      agent-sql:
        condition: service_healthy

  antibot:
    image: avan-antibot:local
    build:
      context: .
      dockerfile: infra/antibot/Dockerfile
    restart: unless-stopped
    environment:
      AVAN_ANTIBOT_SECRET_PATH: /run/secrets/avan_antibot_hmac_key
      AVAN_ANTIBOT_MAX_NUMBER: "25000"
      AVAN_ANTIBOT_TTL_SECONDS: "120"
    secrets:
      - avan_antibot_hmac_key
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2).status==200"]
      interval: 20s
      timeout: 3s
      start_period: 5s
      retries: 5

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: avan_keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password
    volumes:
      - avan-keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U keycloak -d avan_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 15

  keycloak-realm-theme-init:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        export PGPASSWORD="$(cat /run/secrets/keycloak_db_password)"
        if [ "$(psql -h keycloak-db -U keycloak -d avan_keycloak -Atqc "SELECT to_regclass('public.realm')")" = "realm" ]; then
          psql -h keycloak-db -U keycloak -d avan_keycloak -v ON_ERROR_STOP=1 -f /bootstrap/ensure-avan-browser-flow.sql
        fi
    secrets:
      - keycloak_db_password
    volumes:
      - ./infra/keycloak/ensure-avan-browser-flow.sql:/bootstrap/ensure-avan-browser-flow.sql:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak:
    image: avan-keycloak:local
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/bash","-ec"]
    command:
      - |
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        export AVAN_BFF_CLIENT_SECRET="$$(cat /run/secrets/avan_bff_client_secret)"
        export AVAN_PROVISIONER_CLIENT_SECRET="$$(cat /run/secrets/avan_provisioner_client_secret)"
        # The AVAN login appearance is generated at runtime into the shared
        # theme volume. Keycloak's theme/gzip cache otherwise keeps serving the
        # old appearance.json even after GodAdmin saves new orbit/globe settings.
        rm -rf /opt/keycloak/data/tmp/kc-gzip-cache
        exec /opt/keycloak/bin/kc.sh start --optimized --http-enabled=true --import-realm --hostname=http://auth.localhost:8181 --hostname-backchannel-dynamic=true --spi-theme--static-max-age=-1 --spi-theme--cache-themes=false --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/avan_keycloak
      KC_DB_USERNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      AVAN_ANTIBOT_URL: http://antibot:8090
      AVAN_SECURITY_BRIDGE_URL: http://avan:8188/internal/security
      AVAN_SECURITY_BRIDGE_TOKEN_PATH: /run/secrets/avan_bff_client_secret
    secrets:
      - keycloak_db_password
      - avan_bff_client_secret
      - avan_provisioner_client_secret
      - avan_turnstile_site_key
      - avan_turnstile_secret_key
    volumes:
      - ./infra/keycloak/avan-realm.json:/opt/keycloak/data/import/avan-realm.json:ro
      - ./infra/keycloak/themes/avan:/opt/keycloak/themes/avan:ro
      - avan-ui:/opt/keycloak/themes/avan/login/resources/generated:ro
    ports:
      - "127.0.0.1:8181:8080"
    healthcheck:
      # An open port is not enough: bootstrap/import must expose the AVAN realm.
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /realms/avan/.well-known/openid-configuration HTTP/1.1\r\nHost: auth.localhost:8181\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == HTTP/1.*' 200 '* ]]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
    depends_on:
      ui-config-init:
        condition: service_completed_successfully
      antibot:
        condition: service_healthy
      keycloak-db:
        condition: service_healthy
      keycloak-realm-theme-init:
        condition: service_completed_successfully

  avan:
    image: avan-enterprise:local
    build:
      context: .
      dockerfile: commercial/Dockerfile.production
      args:
        PIP_INDEX_URL: ${AVAN_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8188:8188"
    environment:
      AVAN_STATE_DIR: /var/lib/avan
      AVAN_PUBLIC_ORIGIN: http://127.0.0.1:8188
      AVAN_ALLOWED_HOSTS: 127.0.0.1,localhost,avan
      AVAN_SECURITY_BRIDGE_TOKEN_PATH: /run/secrets/avan_bff_client_secret
      AVAN_BUNDLED_IDP: "1"
      AVAN_OIDC_ISSUER: http://auth.localhost:8181/realms/avan
      AVAN_OIDC_JWKS_URL: http://auth.localhost:8181/realms/avan/protocol/openid-connect/certs
      AVAN_BFF_CLIENT_SECRET_PATH: /run/secrets/avan_bff_client_secret
      AVAN_PROVISIONER_CLIENT_SECRET_PATH: /run/secrets/avan_provisioner_client_secret
      AVAN_DATA_TIMEZONE: Asia/Tehran
      AVAN_ANTIBOT_URL: http://antibot:8090
      AVAN_UI_STATE_DIR: /var/lib/avan-ui
    secrets:
      - avan_bff_client_secret
      - avan_provisioner_client_secret
      - avan_turnstile_site_key
      - avan_turnstile_secret_key
    volumes:
      - avan-state:/var/lib/avan
      - avan-ui:/var/lib/avan-ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.localhost:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 192
    mem_limit: 768m
    depends_on:
      ui-config-init:
        condition: service_completed_successfully
      antibot:
        condition: service_started
      keycloak:
        condition: service_healthy
      agent-sql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8188/health',timeout=3).status==200"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

secrets:
  keycloak_db_password:
    file: ./.secrets/keycloak-db-password
  avan_bff_client_secret:
    file: ./.secrets/avan-bff-client-secret
  avan_provisioner_client_secret:
    file: ./.secrets/avan-provisioner-client-secret
  avan_sql_sa_password:
    file: ./.secrets/avan-sql-sa-password
  avan_antibot_hmac_key:
    file: ./.secrets/avan-antibot-hmac-key
  avan_turnstile_site_key:
    file: ./.secrets/avan-turnstile-site-key
  avan_turnstile_secret_key:
    file: ./.secrets/avan-turnstile-secret-key

volumes:
  avan-ui:
  avan-state:
  avan-keycloak-db:
  avan-agent-sql:
