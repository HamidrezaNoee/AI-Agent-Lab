# AVAN enterprise application: first-run GodAdmin bootstraps without .env.
# No production SQL credentials, identity secrets or issuer private key in Compose.
name: avan-production
services:
  avan:
    image: avan-enterprise:local
    build:
      context: .
      dockerfile: commercial/Dockerfile.production
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8188"
    environment:
      AVAN_STATE_DIR: /var/lib/avan
      AVAN_PUBLIC_ORIGIN: http://127.0.0.1:8188
      AVAN_ALLOWED_HOSTS: 127.0.0.1,localhost
      AVAN_DATA_TIMEZONE: Asia/Tehran
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - avan-control-data:/var/lib/avan
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 160
    mem_limit: 768m
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8188/health',timeout=3).status==200"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  avan-control-data:
